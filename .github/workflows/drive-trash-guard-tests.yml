name: drive-trash-guard-tests

on:
  pull_request:
    paths:
      - "apps-script/drive-trash-guard/**"
      - "tests/test_drive_trash_guard.js"
      - ".github/workflows/drive-trash-guard-tests.yml"

permissions:
  contents: read

jobs:
  drive-trash-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tests/test_drive_trash_guard.js
