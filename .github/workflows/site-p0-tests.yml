name: site-p0-tests

on:
  pull_request:
    paths:
      - "apps-script/governor-page-api/**"
      - "tests/test_governor_voice.cjs"
      - ".github/workflows/site-p0-tests.yml"

permissions:
  contents: read

jobs:
  governor-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node --test tests/test_governor_voice.cjs
