name: live-health

# Every 30 minutes: does www.sfdc24.com serve main, do the homepage's voice and
# canvas assets answer, and is the studio controller healthy with voice, talk
# and analyst on? Public reads only - no secrets, nothing written. A red run is
# the alarm, and so is a check that could not see (--strict). A merge can
# leave Pages a minute behind main, so a failure is re-checked once after
# two minutes before the run fails.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public:
    name: live-health / public
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Public acceptance checks (www serves main, assets, controller lanes)
        run: |
          set -uo pipefail
          # --strict: UNKNOWN (nothing answered, a timeout, DNS) fails too. The
          # outage this alarm exists for is the one where nothing can be seen.
          checks=pages_serves_main,site_paths,studio_controller
          if python3 scripts/acceptance_current_state.py --strict --only "$checks"; then exit 0; fi
          echo "re-checking once in 120 s (Pages can trail a merge)"
          sleep 120
          python3 scripts/acceptance_current_state.py --strict --only "$checks"
