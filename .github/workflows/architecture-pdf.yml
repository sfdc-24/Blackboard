name: architecture-pdf

on:
  pull_request:
    paths:
      - ".github/workflows/architecture-pdf.yml"
      - ".gitattributes"
      - "docs/ADR-20260925-BLACKBOARD-MINIBUS-MULTIAGENT-CONTROL-PLANE.md"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260925.pdf"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260925.pdf.sha256"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260926.pdf"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260926.pdf.sha256"
      - "tools/build_sfdc24_architecture_pdf.py"
      - "tools/requirements-architecture-pdf.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/architecture-pdf.yml"
      - ".gitattributes"
      - "docs/ADR-20260925-BLACKBOARD-MINIBUS-MULTIAGENT-CONTROL-PLANE.md"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260925.pdf"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260925.pdf.sha256"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260926.pdf"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260926.pdf.sha256"
      - "tools/build_sfdc24_architecture_pdf.py"
      - "tools/requirements-architecture-pdf.txt"

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-architecture-pdf.txt
      - name: Install the pinned architecture-PDF dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-architecture-pdf.txt
      - name: Reject ambiguous contract encodings
        shell: bash
        run: |
          python - <<'PY'
          import json
          import runpy

          namespace = runpy.run_path("tools/build_sfdc24_architecture_pdf.py")
          reject = namespace["reject_duplicate_json_keys"]
          try:
              json.loads('{"schema_version":1,"schema_version":2}', object_pairs_hook=reject)
          except ValueError:
              pass
          else:
              raise SystemExit("duplicate architecture PDF contract key was accepted")
          invalid = dict(namespace["CONTRACT"])
          invalid["schema_version"] = True
          try:
              namespace["validate_contract"](
                  invalid,
                  namespace["ADR"].read_text(encoding="utf-8"),
              )
          except RuntimeError:
              pass
          else:
              raise SystemExit("boolean architecture PDF schema version was accepted")
          try:
              namespace["validate_contract"](namespace["CONTRACT"], "")
          except RuntimeError:
              pass
          else:
              raise SystemExit("contract-contained phrases satisfied ADR prose anchors")
          PY
      - name: The 2026-09-25 edition stays pinned as a historical artifact
        run: sha256sum --check docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260925.pdf.sha256
      - name: Validate the ADR contract and rebuild the current edition twice, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          artifact="docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260926.pdf"
          attestation="docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260926.pdf.sha256"
          sha256sum --check "$attestation"
          cp "$artifact" /tmp/committed.pdf
          python tools/build_sfdc24_architecture_pdf.py
          cmp /tmp/committed.pdf "$artifact"
          sha256sum --check "$attestation"
          cp "$artifact" /tmp/first-rebuild.pdf
          python tools/build_sfdc24_architecture_pdf.py
          cmp /tmp/first-rebuild.pdf "$artifact"
          sha256sum --check "$attestation"
