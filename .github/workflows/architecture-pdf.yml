name: architecture-pdf

on:
  pull_request:
    paths:
      - ".github/workflows/architecture-pdf.yml"
      - ".gitattributes"
      - "docs/ADR-20260925-BLACKBOARD-MINIBUS-MULTIAGENT-CONTROL-PLANE.md"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260925.pdf"
      - "tools/build_sfdc24_architecture_pdf.py"
      - "tools/requirements-architecture-pdf.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/architecture-pdf.yml"
      - ".gitattributes"
      - "docs/ADR-20260925-BLACKBOARD-MINIBUS-MULTIAGENT-CONTROL-PLANE.md"
      - "docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260925.pdf"
      - "tools/build_sfdc24_architecture_pdf.py"
      - "tools/requirements-architecture-pdf.txt"

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-architecture-pdf.txt
      - name: Install the pinned architecture-PDF dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-architecture-pdf.txt
      - name: Rebuild the committed artifact twice, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          artifact="docs/SFDC24-BLACKBOARD-ARCHITECTURE-20260925.pdf"
          cp "$artifact" /tmp/committed.pdf
          python tools/build_sfdc24_architecture_pdf.py
          cmp /tmp/committed.pdf "$artifact"
          cp "$artifact" /tmp/first-rebuild.pdf
          python tools/build_sfdc24_architecture_pdf.py
          cmp /tmp/first-rebuild.pdf "$artifact"
          sha256sum "$artifact"
