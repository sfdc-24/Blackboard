name: okf-ownership-trusted

# THE GATE. This is the check that decides, and it is the only one that can.
#
# WHY A SECOND WORKFLOW EXISTS AT ALL
#   Codex's P1, carried across three exact-head reviews of this rule (receipts 5974974573 and
#   5974974901, and the verdict on 2ec9ee0): "independent enforcement remains absent". Two separate
#   holes, both of them structural rather than a bug in the rule:
#
#   1. A `pull_request` workflow's own definition comes from the pull request's merge ref. The
#      candidate can therefore EDIT THE ENFORCEMENT STEP - replace the python run with a no-op, or
#      delete the job - and CI is still green. No rule written in Python can close that from inside
#      the repository it is judging.
#   2. `okf-ownership.yml` ran `python tests/test_okf_ownership.py` out of the candidate's tree
#      BEFORE extracting the trusted rule, and then read the rule and the floor through
#      `git show refs/remotes/origin/main:<path>`. That is a LOCAL ref. Candidate code - run by that
#      earlier step of the candidate's own workflow - could repoint it at a commit of its choosing,
#      carrying an unmodified rule and a fabricated grant. The rule's byte-comparison against that
#      ref then agreed with the fabrication. Self-comparison cannot establish authority.
#
# HOW THIS CLOSES BOTH
#   `pull_request_target` is the one pull-request trigger whose workflow definition GitHub takes
#   from the BASE BRANCH and not from the pull request. Editing this file on a branch changes
#   nothing until that edit is merged. And because the job never checks out the candidate's commit
#   and never runs a line of its code, there is no earlier step left to contaminate anything:
#
#     * the checkout is the forge-named base commit, pinned by sha;
#     * scripts/okf_ownership.py verifies that - `git rev-parse HEAD` must BE that sha - and
#       refuses outright otherwise, so the posture cannot be claimed from the command line;
#     * the changed-path set comes from the forge's own `pulls/<n>/files`, not from a local diff
#       against a ref, so there is no ref to shadow and no `--name-only` rename to hide behind;
#     * the floor is the base commit's working tree, read from the checkout rather than through
#       `git show <ref>:`;
#     * the branch's own floor.md is fetched as DATA, read only to refuse a branch that proposes
#       two pens on one page. It is never checked out and never executed;
#     * `--base-ref` is passed and must name the protected branch, or no grant counts: a pull
#        request may target an unmerged branch of its own, and that branch may carry anything.
#
#   There is no fallback. A missing changed-path list, a checkout that is not the base commit, or a
#   base that is not the protected branch all REFUSE. "Do not silently fall back to candidate
#   enforcement" was the instruction, and nothing here does.
#
# WHAT IT IS NOT
#   A branch prefix is attribution, not an authenticated identity - the whole fleet pushes as one
#   GitHub account. This gate says which paths a prefix may write; it does not say who holds it.
#   That needs a GitHub App per agent, which is a build and his word, and is written down as such.
#
# BOOTSTRAP, SAID PLAINLY
#   Until this file is on main, GitHub has no base-branch copy of it to run, so the pull request
#   that lands it is not gated by it. That is the honest state of any first commit of a gate, and
#   it is why the step below prints which commit it is running out of.

on:
  pull_request_target:
    # `edited` is here because GitHub fires it when the BASE BRANCH IS CHANGED, and retargeting
    # is one of the two ways a green gate run can stop describing the pull request in front of
    # you (Codex's fourth finding on the conference twin). The other is main moving under it,
    # which the "current tip" step below refuses.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: okf-ownership / the gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PINNED TO COMMIT SHAs, not tags: a tag is repointed by its maintainers, so the code this
      # workflow runs could change without a commit here - and this workflow is the authority.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # THE BASE MUST BE THE PROTECTED BRANCH'S CURRENT TIP.
      #
      # A green run says "these paths were allowed by the floor as main held it AT base.sha". Main
      # moves. A grant REVOKED on main after this ran leaves the green tick in place and says
      # nothing about the floor as it now stands (Codex: "A previously green grant may remain
      # green after that grant is revoked"). So the gate refuses to answer about a base that is no
      # longer the tip, which is strict-base enforced inside the gate rather than hoped for.
      #
      # WHAT THIS DOES NOT CLOSE, stated rather than implied: an OLD green tick already on the
      # pull request is still an old green tick. Only branch protection can require the gate as a
      # context AND require the branch to be up to date, and that is the repository owner's
      # setting. Until he turns both on, this is a strong advisory gate, not a merge barrier.
      - name: The base must be the protected branch as it stands right now
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${REPO}/git/ref/heads/${BASE_REF}" --jq '.object.sha')
          echo "base.sha from the event : ${BASE_SHA}"
          echo "${BASE_REF} tip right now : ${tip}"
          if [ "${tip}" != "${BASE_SHA}" ]; then
            echo "::error::${BASE_REF} has moved since this pull request was last synchronized," \
                 "so a verdict taken against ${BASE_SHA} would not describe the floor as it now" \
                 "stands. Push to the branch (or merge ${BASE_REF} into it) and the gate re-runs" \
                 "against the new tip." >&2
            exit 1
          fi
          echo "the base is the current tip, so the floor this run reads is the live one"

      - name: Say which commit this gate is running out of
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "base ref  : ${BASE_REF}"
          echo "base sha  : ${BASE_SHA}"
          echo "checkout  : $(git rev-parse HEAD)"
          echo "candidate : ${HEAD_SHA}  (not checked out, not run)"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"

      - name: What the forge says changed, and the branch's own floor as data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DECLARED: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          # BOTH ends of a rename. `--name-only` showed only where a file landed, which is how a
          # renamed floor.md would have gone unseen; the forge reports previous_filename for it.
          #
          # A JSON ARRAY, NOT LINES. The first version wrote one path per line and the rule
          # stripped each one, which is lossy: a leading or trailing space is a VALID PATH BYTE,
          # so the unowned " docs/okf/index.md" arrived as the owned "docs/okf/index.md" (Codex on
          # the conference twin). `@json` encodes each path as a JSON string on its own line - so
          # even a path containing a newline survives the line split - and `jq -s` collects them.
          gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
            --jq '.[] | (.filename, (.previous_filename // empty)) | @json' \
            | jq -s 'unique' > "${RUNNER_TEMP}/changed.json"
          # `pulls/<n>/files` is capped at 3000 entries. A pull request larger than that cannot
          # have its changed set confirmed, so it is refused rather than judged on a partial list.
          named=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename | @json' \
                  | jq -s 'unique | length')
          echo "the forge declares ${DECLARED} changed file(s); ${named} name(s) came back"
          if [ "${named}" -ne "${DECLARED}" ]; then
            echo "::error::the changed-file list is incomplete (${named} of ${DECLARED}); the OKF" \
                 "cannot be judged on a partial set" >&2
            exit 1
          fi
          echo "changed paths, both ends of every rename included, byte for byte:"
          jq -r '.[] | @json' "${RUNNER_TEMP}/changed.json"
          # THE BRANCH'S OWN floor.md, READ ONLY TO REFUSE, AND FAILING CLOSED.
          #
          # It is read so a branch cannot propose two pens on one page, and it is fetched as DATA
          # from the forge: never checked out, never executed. The first version turned EVERY
          # failure into an empty floor - a 403, a 500, a `type: symlink`, and the documented case
          # where the contents API omits base64 content for a blob over 1 MiB. An empty floor
          # proposes nothing, so each of those silently skipped the overlap refusal for an
          # operator change to floor.md (Codex on a1e1e4f and 2496937). Now: only a confirmed 404
          # means absence, only a `file` with base64 content whose decoded length matches the
          # declared size is read, and anything else fails the gate.
          cand="${RUNNER_TEMP}/candidate-floor.md"
          : > "$cand"
          # THE TREE ENTRY FIRST, because the Contents API DEREFERENCES a symlink that points
          # inside the repository: GitHub documents that such a link comes back in the normal-file
          # response format, so `type: file` is not evidence of a regular file (Codex's P1 on
          # f209b38). The git trees API gives the mode and does not dereference anything. A
          # candidate floor that is not mode 100644 or 100755 fails the gate here, before its
          # bytes are ever read, rather than passing now and bricking every later pull request
          # once the crooked entry is on the protected branch.
          mode=$(gh api "repos/${HEAD_REPO}/git/trees/${HEAD_SHA}:docs/okf" \
                   --jq '.tree[] | select(.path == "floor.md") | .mode' 2>/dev/null || true)
          echo "the candidate's tree entry for docs/okf/floor.md: mode=${mode:-<absent>}"
          if [ -n "${mode}" ] && [ "${mode}" != "100644" ] && [ "${mode}" != "100755" ]; then
            echo "::error::the branch's docs/okf/floor.md has tree mode ${mode}, not a regular" \
                 "file. An authority file may not be a symlink, a gitlink or a directory, and" \
                 "the Contents API would have dereferenced it into looking like one." >&2
            exit 1
          fi
          set +e
          gh api -i "repos/${HEAD_REPO}/contents/docs/okf/floor.md?ref=${HEAD_SHA}" \
            > "${RUNNER_TEMP}/floor.http" 2> "${RUNNER_TEMP}/floor.err"
          set -e
          code=$(awk 'NR==1 {print $2; exit}' "${RUNNER_TEMP}/floor.http")
          echo "the contents API answered HTTP ${code:-<none>} for the branch's floor.md"
          if [ "${code}" = "404" ]; then
            echo "confirmed absent on the candidate: this branch proposes no floor"
          elif [ "${code}" = "200" ]; then
            body=$(sed -n '/^[[{]/,$p' "${RUNNER_TEMP}/floor.http")
            kind=$(printf '%s' "$body" | jq -r '.type // "missing"')
            enc=$(printf '%s' "$body" | jq -r '.encoding // "missing"')
            size=$(printf '%s' "$body" | jq -r '.size // -1')
            if [ "${kind}" != "file" ]; then
              echo "::error::the branch's docs/okf/floor.md is a '${kind}', not a file. An" \
                   "authority file may not be a symlink, a directory or a submodule." >&2
              exit 1
            fi
            if [ "${enc}" != "base64" ]; then
              echo "::error::the contents API returned encoding '${enc}' for the branch's" \
                   "floor.md (declared size ${size}), so its bytes were never verified. A blob" \
                   "over 1 MiB comes back this way, and an unverified floor is not an empty" \
                   "floor." >&2
              exit 1
            fi
            printf '%s' "$body" | jq -r '.content' | base64 -d > "$cand"
            got=$(wc -c < "$cand")
            if [ "${got}" != "${size}" ]; then
              echo "::error::decoded ${got} byte(s) of the branch's floor.md and the API declared" \
                   "${size}." >&2
              exit 1
            fi
            echo "verified ${got} byte(s) of the branch's own floor.md"
          else
            echo "::error::the contents API answered HTTP ${code:-<none>} for the branch's" \
                 "floor.md. ONLY a confirmed 404 may mean absence; every other answer leaves the" \
                 "proposed-overlap refusal unable to run, so the gate fails instead." >&2
            cat "${RUNNER_TEMP}/floor.err" >&2 || true
            exit 1
          fi

      # The base branch's own tests, over the base branch's own rule. No candidate input reaches
      # them; this is the gate checking that the copy of the rule it is about to run still answers
      # its own controls.
      # `-I` IS LOAD-BEARING, not tidiness. Codex's P1 on f209b38: `python tests/x.py` puts
      # `tests/` at the FRONT of sys.path and `python scripts/x.py` puts `scripts/` there, so a
      # non-operator pull request could add `tests/json.py` or `scripts/json.py` - paths the rule
      # happily allowed - and once merged those files would execute at import time on every later
      # gate run, before either protected file. They need only exit 0 to keep this check green
      # while bypassing the tests and the ownership decision entirely. Isolated mode drops the
      # script directory from sys.path and ignores PYTHON* environment variables, so there is no
      # such slot to fill. The module fence in the rule is the belt behind this brace.
      - name: The rule's own tests, from the base tree
        run: python -I -B tests/test_okf_ownership.py

      - name: This pull request writes the OKF only where the protected branch says it may
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python -I -B scripts/okf_ownership.py "${HEAD_REF}" \
            --trusted-base "${BASE_SHA}" \
            --base-ref "${BASE_REF}" \
            --changed-from "${RUNNER_TEMP}/changed.json" \
            --candidate-floor "${RUNNER_TEMP}/candidate-floor.md" \
            --repo .
