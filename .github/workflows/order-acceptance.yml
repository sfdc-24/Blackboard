name: ORDER acceptance (offline)

on:
  pull_request:
    paths:
      - '.github/workflows/order-acceptance.yml'
      - 'scripts/OrderSupervisor.psm1'
      - 'scripts/order_supervisor.ps1'
      - 'scripts/bus.ps1'
      - 'scripts/install_order_supervisor.ps1'
      - 'scripts/invoke_order_claude.ps1'
      - 'scripts/order_supervisor_result.schema.json'
      - 'infra/azure/blackboard_vm_supervisor.ps1'
      - 'infra/azure/install_release_from_archive.ps1'
      - 'infra/azure/order_system_adapter_smoke.ps1'
      - 'infra/azure/validate_order_job_schedule_links.ps1'
      - 'infra/azure/order_task_escrow.ps1'
      - 'infra/azure/order_cutover_phase.ps1'
      - 'infra/azure/stage_order_escrow_tool.ps1'
      - 'infra/azure/build_order_escrow_transport_wrapper.ps1'
      - 'infra/azure/build_order_release_archive.ps1'
      - 'infra/azure/build_order_release_wrapper.ps1'
      - 'infra/azure/job-schedule-00.json'
      - 'infra/azure/job-schedule-30.json'
      - 'tests/test_order_read_resilience.ps1'
      - 'tests/test_bus_read_response_contract.ps1'
      - 'tests/test_bus_timestamp_contract.ps1'
      - 'tests/test_order_state_preservation.ps1'
      - 'tests/test_order_installer_safety.ps1'
      - 'tests/test_order_release_installer.ps1'
      - 'tests/test_order_release_manifest_string_preservation.ps1'
      - 'tests/test_order_system_adapter_smoke.ps1'
      - 'tests/test_order_job_schedule_link_validator.ps1'
      - 'tests/test_order_task_escrow.ps1'
      - 'tests/test_order_cutover_phase.ps1'
      - 'tests/test_order_escrow_transport.ps1'
      - 'tests/test_order_release_packager.ps1'
      - 'tests/test_order_deployment_wrappers.ps1'
      - 'tests/test_order_supervisor.ps1'
      - 'tests/test_order_workspace.ps1'
      - 'tests/test_azure_vm_supervisor.ps1'
      - 'tests/fixtures/order_supervisor_board.json'
      - 'docs/ONBOARDING.md'

permissions:
  contents: read

jobs:
  powershell-7-release-packager:
    name: ORDER release packager and bus contract on PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test ORDER deterministic release packager
        shell: pwsh
        run: .\tests\test_order_release_packager.ps1
      - name: Test ORDER release-manifest string preservation
        shell: pwsh
        run: .\tests\test_order_release_manifest_string_preservation.ps1
      - name: Test Blackboard writer timestamp contract
        shell: pwsh
        run: .\tests\test_bus_timestamp_contract.ps1
      - name: Test BUS read-response contract on PowerShell 7
        shell: pwsh
        run: |
          $priorErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $rawOutput = @(& pwsh -NoLogo -NoProfile -NonInteractive -File .\tests\test_bus_read_response_contract.ps1 2>&1)
            $suiteExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $priorErrorActionPreference
          }
          [string[]]$output = @($rawOutput | ForEach-Object { [string]$_ })
          $output | ForEach-Object { Write-Output $_ }
          $engine = @($output | Where-Object { $_ -clike 'ENGINE *' })
          $cases = @($output | Where-Object { $_ -clike 'CASES *' })
          $pass = @($output | Where-Object { $_ -clike 'PASS *' })
          $fail = @($output | Where-Object { $_ -clike 'FAIL *' })
          $result = @($output | Where-Object { $_ -clike 'RESULT *' })
          $nonblank = @($output | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($suiteExit -ne 0 -or
              $engine.Count -ne 1 -or $engine[0] -cnotmatch '^ENGINE Core .+ child=.*[\\/]pwsh\.exe$' -or
              $cases.Count -ne 1 -or $cases[0] -cne 'CASES 98' -or
              $pass.Count -ne 880 -or $fail.Count -ne 0 -or $result.Count -ne 1 -or
              $nonblank[-1] -cne 'RESULT passed=880 failed=0') {
            throw ('bus_read_response_contract_failed: exit=' + $suiteExit +
                   '; engine=' + ($engine -join ',') + '; cases=' + ($cases -join ',') +
                   '; pass=' + $pass.Count + '; fail=' + $fail.Count +
                   '; result=' + ($result -join ','))
          }
      - name: Test bounded ORDER board-read resilience
        shell: pwsh
        run: .\tests\test_order_read_resilience.ps1
      # The step above runs the SUITE on PowerShell 7. It still launches bus.ps1 in a
      # child process, and that child defaults to powershell.exe -- so on its own it
      # proves nothing about the bus client on the edition being migrated to. This
      # step moves the child too, and then refuses to pass unless the child really
      # moved: a misspelt variable name would otherwise run 5.1 and report green.
      - name: Test bounded ORDER board-read resilience with the bus client on PowerShell 7
        shell: pwsh
        env:
          ORDER_TEST_CHILD_SHELL: pwsh
        run: |
          $output = .\tests\test_order_read_resilience.ps1
          $suiteExit = $LASTEXITCODE
          $output
          $childShell = @($output | Where-Object { $_ -like 'CHILD_SHELL *' })
          if ($childShell.Count -ne 1 -or $childShell[0] -notmatch 'pwsh') {
            throw ("This leg exists to exercise bus.ps1 under PowerShell 7. The child " +
                   "shell was: " + ($childShell -join ' '))
          }
          if ($suiteExit -ne 0) { exit $suiteExit }

  windows-powershell-51:
    name: ORDER and Azure contracts on Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test bounded ORDER board-read resilience
        shell: powershell
        run: .\tests\test_order_read_resilience.ps1
      - name: Test BUS read-response contract on Windows PowerShell 5.1
        shell: powershell
        run: |
          $priorErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $rawOutput = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\test_bus_read_response_contract.ps1 2>&1)
            $suiteExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $priorErrorActionPreference
          }
          [string[]]$output = @($rawOutput | ForEach-Object { [string]$_ })
          $output | ForEach-Object { Write-Output $_ }
          $engine = @($output | Where-Object { $_ -clike 'ENGINE *' })
          $cases = @($output | Where-Object { $_ -clike 'CASES *' })
          $pass = @($output | Where-Object { $_ -clike 'PASS *' })
          $fail = @($output | Where-Object { $_ -clike 'FAIL *' })
          $result = @($output | Where-Object { $_ -clike 'RESULT *' })
          $nonblank = @($output | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($suiteExit -ne 0 -or
              $engine.Count -ne 1 -or $engine[0] -cnotmatch '^ENGINE Desktop 5\.1\..+ child=.*[\\/]powershell\.exe$' -or
              $cases.Count -ne 1 -or $cases[0] -cne 'CASES 98' -or
              $pass.Count -ne 880 -or $fail.Count -ne 0 -or $result.Count -ne 1 -or
              $nonblank[-1] -cne 'RESULT passed=880 failed=0') {
            throw ('bus_read_response_contract_failed: exit=' + $suiteExit +
                   '; engine=' + ($engine -join ',') + '; cases=' + ($cases -join ',') +
                   '; pass=' + $pass.Count + '; fail=' + $fail.Count +
                   '; result=' + ($result -join ','))
          }
      - name: Test Blackboard writer timestamp contract
        shell: powershell
        run: .\tests\test_bus_timestamp_contract.ps1
      - name: Test ORDER state preservation
        shell: powershell
        run: .\tests\test_order_state_preservation.ps1
      - name: Test ORDER task installer safety
        shell: powershell
        run: .\tests\test_order_installer_safety.ps1
      - name: Test ORDER immutable release installer
        shell: powershell
        run: .\tests\test_order_release_installer.ps1
      - name: Test ORDER release-manifest string preservation
        shell: powershell
        run: .\tests\test_order_release_manifest_string_preservation.ps1
      - name: Test provider-free ORDER SYSTEM adapter smoke
        shell: powershell
        run: .\tests\test_order_system_adapter_smoke.ps1
      - name: Test ORDER Azure job-schedule link validation
        shell: powershell
        run: .\tests\test_order_job_schedule_link_validator.ps1
      - name: Test ORDER independent task escrow
        shell: powershell
        run: .\tests\test_order_task_escrow.ps1
      - name: Test ORDER bounded guest cutover phases
        shell: powershell
        run: .\tests\test_order_cutover_phase.ps1
      - name: Test ORDER escrow transport
        shell: powershell
        run: .\tests\test_order_escrow_transport.ps1
      - name: Test ORDER deterministic release packager
        shell: powershell
        run: .\tests\test_order_release_packager.ps1
      - name: Test ORDER deployment wrapper builders
        shell: powershell
        run: .\tests\test_order_deployment_wrappers.ps1
      - name: Test ORDER supervisor contracts
        shell: powershell
        run: .\tests\test_order_supervisor.ps1
      - name: Test ORDER workspace and task contracts
        shell: powershell
        run: .\tests\test_order_workspace.ps1
      - name: Test Azure supervisor contracts
        shell: powershell
        run: .\tests\test_azure_vm_supervisor.ps1

  powershell-7-release-manifest-linux:
    name: ORDER release-manifest and bus response contracts on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the intended Linux PowerShell host
        shell: pwsh
        run: |
          $hasDateKind = (Get-Command ConvertFrom-Json).Parameters.ContainsKey('DateKind')
          if (-not $IsLinux -or -not $hasDateKind) {
            throw "This job requires Linux and ConvertFrom-Json -DateKind (PowerShell 7.5+)."
          }
      - name: Test ORDER release-manifest string preservation
        shell: pwsh
        run: ./tests/test_order_release_manifest_string_preservation.ps1
      - name: Test BUS read-response contract on Linux PowerShell 7
        shell: pwsh
        run: |
          $priorErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $rawOutput = @(& pwsh -NoLogo -NoProfile -NonInteractive -File ./tests/test_bus_read_response_contract.ps1 2>&1)
            $suiteExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $priorErrorActionPreference
          }
          [string[]]$output = @($rawOutput | ForEach-Object { [string]$_ })
          $output | ForEach-Object { Write-Output $_ }
          $engine = @($output | Where-Object { $_ -clike 'ENGINE *' })
          $cases = @($output | Where-Object { $_ -clike 'CASES *' })
          $pass = @($output | Where-Object { $_ -clike 'PASS *' })
          $fail = @($output | Where-Object { $_ -clike 'FAIL *' })
          $result = @($output | Where-Object { $_ -clike 'RESULT *' })
          $nonblank = @($output | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($suiteExit -ne 0 -or
              $engine.Count -ne 1 -or $engine[0] -cnotmatch '^ENGINE Core .+ child=.*/pwsh$' -or
              $cases.Count -ne 1 -or $cases[0] -cne 'CASES 98' -or
              $pass.Count -ne 880 -or $fail.Count -ne 0 -or $result.Count -ne 1 -or
              $nonblank[-1] -cne 'RESULT passed=880 failed=0') {
            throw ('bus_read_response_contract_failed: exit=' + $suiteExit +
                   '; engine=' + ($engine -join ',') + '; cases=' + ($cases -join ',') +
                   '; pass=' + $pass.Count + '; fail=' + $fail.Count +
                   '; result=' + ($result -join ','))
          }
      - name: Test focused IWR security resilience on Linux PowerShell 7
        shell: pwsh
        run: |
          $childShell = (Get-Command pwsh -CommandType Application -ErrorAction Stop |
                         Select-Object -First 1).Source
          if (-not $IsLinux -or [string]::IsNullOrWhiteSpace($childShell) -or
              $PSVersionTable.PSVersion -lt [version]'7.5' -or
              -not [IO.Path]::IsPathRooted($childShell) -or
              [IO.Path]::GetFileName($childShell) -cne 'pwsh') {
            throw ('This step requires Linux PowerShell 7.5+ and an absolute pwsh executable; resolved: ' +
                   $childShell + '; host=' + $PSVersionTable.PSVersion)
          }

          $env:ORDER_TEST_CHILD_SHELL = $childShell
          $expectedBusSource = 'SOURCE bus.ps1 sha256=' +
            (Get-FileHash -LiteralPath ./scripts/bus.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSuiteSource = 'SOURCE test_order_read_resilience.ps1 sha256=' +
            (Get-FileHash -LiteralPath ./tests/test_order_read_resilience.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $priorErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $rawOutput = @(& $childShell -NoLogo -NoProfile -NonInteractive `
              -File ./tests/test_order_read_resilience.ps1 -Scope IwrOnly 2>&1)
            $suiteExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $priorErrorActionPreference
          }

          [string[]]$output = @($rawOutput | ForEach-Object { [string]$_ })
          $output | ForEach-Object { Write-Output $_ }

          $childShellLines = @($output | Where-Object { $_ -clike 'CHILD_SHELL *' })
          $scopeLines = @($output | Where-Object { $_ -clike 'SCOPE *' })
          $engineLines = @($output | Where-Object { $_ -clike 'ENGINE *' })
          $sourceLines = @($output | Where-Object { $_ -clike 'SOURCE *' })
          $caseLines = @($output | Where-Object { $_ -clike 'CASES *' })
          $passLines = @($output | Where-Object { $_ -clike 'PASS *' })
          $failLines = @($output | Where-Object { $_ -clike 'FAIL *' })
          $resultLines = @($output | Where-Object { $_ -clike 'RESULT *' })
          $expectedResultLines = @($output | Where-Object { $_ -cmatch '^RESULT passed=26 failed=0$' })
          $nonblankLines = @($output | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $terminalLine = if ($nonblankLines.Count -gt 0) { $nonblankLines[-1] } else { '' }

          $problems = New-Object System.Collections.Generic.List[string]
          if ($suiteExit -ne 0) {
            $problems.Add('suite_exit=' + $suiteExit)
          }
          if ($childShellLines.Count -ne 1 -or
              $childShellLines[0] -cne ('CHILD_SHELL ' + $childShell)) {
            $problems.Add('child_shell=' + ($childShellLines -join ','))
          }
          if ($scopeLines.Count -ne 1 -or $scopeLines[0] -cne 'SCOPE IwrOnly') {
            $problems.Add('scope=' + ($scopeLines -join ','))
          }
          if ($engineLines.Count -ne 1 -or
              $engineLines[0] -cne ('ENGINE Core ' + $PSVersionTable.PSVersion + ' child=' + $childShell)) {
            $problems.Add('engine=' + ($engineLines -join ','))
          }
          if ($sourceLines.Count -ne 2 -or
              @($sourceLines | Where-Object { $_ -ceq $expectedBusSource }).Count -ne 1 -or
              @($sourceLines | Where-Object { $_ -ceq $expectedSuiteSource }).Count -ne 1) {
            $problems.Add('source=' + ($sourceLines -join ','))
          }
          if ($caseLines.Count -ne 1 -or $caseLines[0] -cne 'CASES 26') {
            $problems.Add('cases=' + ($caseLines -join ','))
          }
          if ($passLines.Count -ne 26) {
            $problems.Add('pass_count=' + $passLines.Count)
          }
          if ($failLines.Count -ne 0) {
            $problems.Add('fail_count=' + $failLines.Count)
          }
          if ($resultLines.Count -ne 1 -or $expectedResultLines.Count -ne 1 -or
              $terminalLine -cne 'RESULT passed=26 failed=0') {
            $problems.Add('result=' + ($resultLines -join ','))
          }
          if ($problems.Count -gt 0) {
            throw ('order_iwr_security_linux_failed: ' + ($problems -join '; '))
          }

  powershell-7-workspace-linux:
    name: ORDER workspace contracts on Linux PowerShell 7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test complete ORDER workspace contract on Linux
        shell: pwsh
        env:
          ORDER_TEST_CHILD_SHELL: pwsh
        run: |
          $hasDateKind = (Get-Command ConvertFrom-Json).Parameters.ContainsKey('DateKind')
          if (-not $IsLinux -or -not $hasDateKind) {
            throw 'This job requires Linux and ConvertFrom-Json -DateKind (PowerShell 7.5+).'
          }

          $priorErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $rawOutput = @(
              & pwsh -NoLogo -NoProfile -NonInteractive `
                -File ./tests/test_order_workspace.ps1 2>&1
            )
            $suiteExit = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $priorErrorActionPreference
          }

          [string[]]$output = @($rawOutput | ForEach-Object { [string]$_ })
          $output | ForEach-Object { Write-Output $_ }

          $childShellLines = @($output | Where-Object { $_ -clike 'CHILD_SHELL *' })
          $passLines = @($output | Where-Object { $_ -clike 'PASS *' })
          $failLines = @($output | Where-Object { $_ -clike 'FAIL *' })
          $resultLines = @($output | Where-Object { $_ -clike 'RESULT *' })
          $nonblankLines = @($output | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $terminalLine = if ($nonblankLines.Count -gt 0) { $nonblankLines[-1] } else { '' }

          $problems = New-Object System.Collections.Generic.List[string]
          if ($suiteExit -ne 0) {
            $problems.Add('suite_exit=' + $suiteExit)
          }
          if ($childShellLines.Count -ne 1 -or
              $childShellLines[0] -cnotmatch '^CHILD_SHELL .*/pwsh$') {
            $problems.Add('child_shell=' + ($childShellLines -join ','))
          }
          if ($passLines.Count -ne 324) {
            $problems.Add('pass_count=' + $passLines.Count)
          }
          if ($failLines.Count -ne 0) {
            $problems.Add('fail_count=' + $failLines.Count)
          }
          if ($resultLines.Count -ne 1) {
            $problems.Add('result_count=' + $resultLines.Count)
          }
          if ($terminalLine -cne 'RESULT passed=324 failed=0') {
            $problems.Add('terminal_result=' + $terminalLine)
          }
          if ($problems.Count -gt 0) {
            throw ('linux_workspace_contract_failed: ' + ($problems -join '; '))
          }
