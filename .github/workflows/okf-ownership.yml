name: okf-ownership

# His directive of 2026-10-03 (GROK-OKF-LIVE-WRITE-20261003T1426Z): docs/okf/ has one writer and
# everyone else reads it, with the pen handed over during a call. scripts/okf_ownership.py is the
# rule; this is what runs it. The handover is read from the pull request's BASE, never from the
# branch being checked, so a branch cannot write its own grant and be admitted by it (Codex's P1 on
# conference #161). The check has an opinion about docs/okf/ and about nothing else in this repo.

on:
  pull_request:

permissions:
  contents: read

jobs:
  okf:
    name: okf-ownership / one writer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The rule's own tests
        run: python tests/test_okf_ownership.py
      # The rule is taken from the protected branch and run from outside the checkout. CI used to
      # run scripts/okf_ownership.py out of the candidate's own tree, so the branch being judged
      # could edit its judge (Codex 20:26Z). A pull request may still change the rule, but the
      # change enforces nothing until it is merged. The changed paths come from git inside the
      # rule, not from this step: `--name-only` showed only where a rename landed.
      - name: This PR writes the OKF only where it may, by the rule on the protected branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "${RUNNER_TEMP}/trusted"
          # The rule that judges this pull request is the copy on main, taken out of the checkout
          # the branch controls. This pull request is the one that puts that version THERE, so
          # until it merges there is nothing trusted to take: the step tries, says which copy it
          # ran, and every pull request after this one gets the copy from main.
          RULE="scripts/okf_ownership.py"
          if git show "origin/main:scripts/okf_ownership.py" > "${RUNNER_TEMP}/trusted/okf_ownership.py" 2>/dev/null \
             && grep -q -- '"--protected"' "${RUNNER_TEMP}/trusted/okf_ownership.py"; then
            RULE="${RUNNER_TEMP}/trusted/okf_ownership.py"
            sha256sum "${RULE}"
            echo "the rule comes from origin/main"
          else
            echo "origin/main does not carry this version of the rule yet:"
            echo "running this pull request's own copy, which its review reads anyway"
          fi
          git -c core.quotePath=false diff --name-status -M -C "origin/${BASE_REF}...HEAD"
          python "${RULE}" "${HEAD_REF}" \
            --protected origin/main --base "origin/${BASE_REF}" --repo .
