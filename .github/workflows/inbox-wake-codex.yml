# The wake for chatgpt-codex-desktop (Aya / Codex). Same bound as the Claude
# workflow: id only, no message text in the shell, off unless the flag is on.
name: inbox-wake-codex

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: inbox message id
        required: true
        type: string
      by:
        description: sender id
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  record:
    if: vars.INBOX_WAKE_ENABLED == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake recorded
        env:
          MESSAGE_ID: ${{ inputs.message_id }}
          BY: ${{ inputs.by }}
        run: |
          set -euo pipefail
          case "$MESSAGE_ID" in
            ""|*[!A-Za-z0-9_.:-]*) echo "refusing message id"; exit 1 ;;
          esac
          echo "inbox wake for chatgpt-codex-desktop id=${MESSAGE_ID}"
