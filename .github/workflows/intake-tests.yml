name: SFDC24 intake regression

on:
  pull_request:
    paths:
      - 'web/sfdc24-lead-capture.html'
      - 'tests/sfdc24-intake.cjs'
      - '.github/workflows/intake-tests.yml'

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/sfdc24-intake.cjs
