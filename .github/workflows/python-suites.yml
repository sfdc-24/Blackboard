# Hosted CI for the self-contained Python suites.
#
# WHY THIS EXISTS
#   Both PR55 (xray-score-v1) and PR56 (open_for_me) were blocked on the same
#   finding: the suites pass when run directly and there is no hosted check, so
#   a reviewer has to take the author's word for a number. "Green is not proof"
#   cuts both ways - an unrunnable test is not evidence either.
#
# WHY IT RUNS THE FILES DIRECTLY
#   These suites are plain scripts that print results and call sys.exit(1) on
#   failure. `unittest discover` does NOT collect them and exits 0 having run
#   nothing, which is worse than no CI: a green tick over zero assertions.
#   Running the file is what actually honours its exit code.
#
# WHY EACH SUITE IS NAMED RATHER THAN GLOBBED
#   tests/ also holds node:test suites, PowerShell suites and network-touching
#   scripts. A glob would drag those in and either fail or, worse, make a
#   network call from CI. Every suite listed here is offline by construction -
#   no org, no board, no bus, no credentials - and that is PROVED by running
#   them in an empty network namespace rather than asserted in a comment.
name: python-suites

on:
  pull_request:
    paths:
      - "scripts/xray_score.py"
      - "scripts/open_for_me.py"
      - "tests/test_xray_score.py"
      - "tests/test_open_for_me.py"
      - ".github/workflows/python-suites.yml"
  push:
    branches: [main]
    paths:
      - "scripts/xray_score.py"
      - "scripts/open_for_me.py"
      - "tests/test_xray_score.py"
      - "tests/test_open_for_me.py"
      - ".github/workflows/python-suites.yml"

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show what will run
        run: |
          set -euo pipefail
          echo "python: $(python3 --version)"
          for t in tests/test_xray_score.py tests/test_open_for_me.py; do
            if [ -f "$t" ]; then echo "present : $t"; else echo "absent  : $t"; fi
          done

      # Each suite is its own step so a failure names the suite in the UI rather
      # than hiding inside a loop. `if [ -f ]` because the two suites arrive on
      # different branches; a branch carrying only one must not fail on the
      # other's absence.
      # Each suite runs inside an EMPTY NETWORK NAMESPACE (`unshare -n`), so
      # "these tests need no network" is proved by execution rather than
      # asserted. If a future edit adds a real call, the suite fails here.
      #
      # The first version of this workflow grepped the suites for "urlopen" and
      # friends instead. It failed immediately - on a test whose whole job is to
      # assert that the ENGINE contains exactly one urlopen, so the word appears
      # in a string literal. A substring cannot tell "calls urlopen" from
      # "asserts about urlopen", and the behavioural check does not have to.
      - name: xray-score-v1 (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_xray_score.py ]; then
            sudo unshare -n python3 tests/test_xray_score.py
          else
            echo "not on this branch; skipping"
          fi

      - name: open_for_me (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_open_for_me.py ]; then
            sudo unshare -n python3 tests/test_open_for_me.py
          else
            echo "not on this branch; skipping"
          fi

      # A workflow that skips everything and reports success is the failure mode
      # this file exists to prevent. If neither suite ran, say so and fail.
      - name: Refuse a green tick over nothing
        run: |
          set -euo pipefail
          if [ ! -f tests/test_xray_score.py ] && [ ! -f tests/test_open_for_me.py ]; then
            echo "Neither suite is present, so this check proved nothing." >&2
            echo "A passing check over zero assertions is worse than no check." >&2
            exit 1
          fi
          echo "at least one suite ran for real"

      # A negative control for the isolation itself. If `unshare -n` silently
      # stopped isolating, every "no network" claim above would be worthless and
      # nothing would say so.
      - name: Prove the isolation actually isolates
        run: |
          set -euo pipefail
          if sudo unshare -n python3 -c "import urllib.request; urllib.request.urlopen('http://example.com', timeout=5)" 2>/dev/null; then
            echo "unshare -n did NOT isolate the network; the offline claims above prove nothing" >&2
            exit 1
          fi
          echo "confirmed: no network inside the namespace the suites ran in"
