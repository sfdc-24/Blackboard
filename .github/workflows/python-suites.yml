permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PINNED TO COMMIT SHAs, not tags. `actions/checkout@v4` is a MUTABLE
      # reference - the tag is repointed by its maintainers, so the code this
      # workflow runs can change without a commit here. These suites gate safety
      # claims about holds and credentials; the reviewed workflow and the
      # executed workflow must be the same thing.
      #
      # persist-credentials: false because nothing after checkout pushes, tags
      # or calls the API, and the default leaves a usable GITHUB_TOKEN in
      # .git/config for every later step that runs test code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Show what will run
        run: |
          set -euo pipefail
          echo "python: $(python3 --version)"
          for t in tests/test_xray_score.py tests/test_open_for_me.py \
                   tests/test_bus_benchmark.py tests/test_append_payload_guard.py \
                   tests/test_bus.py tests/test_bcb_lint.py \
                   tests/test_clasp_target_is_current.py \
                   tests/test_consult_never_files_a_blank.py \
                   tests/test_waker_watermark.py \
                   tests/test_board_waker_ack.py \
                   tests/test_waker_dependencies.py \
                   tests/test_foundry_host.py \
                   tests/test_wa_media.py \
                   tests/test_wa_board_outbox.py \
                   tests/test_wa_notify.py \
                   tests/test_cloud_runtime_contract.py \
                   tests/test_waker_peek_verdict.py \
                   tests/test_board_probe_readonly.py \
                   tests/test_governor_live_check.py \
                   tests/test_board_probe_read_retry.py \
                   tests/test_read_since_retry.py \
                   tests/test_state_store.py \
                   tests/test_waker_shadow.py \
                   tests/test_board_watcher.py \
                   tests/test_wa_outbox_cloud.py \
                   tests/test_gemini_cloud_waker.py \
                   tests/test_soak_report.py \
                   tests/test_studio_controller.py \
                   tests/test_studio_auth.py \
                   tests/test_studio_email_sender.cjs \
                   tests/test_studio_claude_worker.py \
                   tests/test_studio_org_facts.py \
                   tests/test_studio_lead_facts.py \
                   tests/test_studio_lead_deadline.py \
                   tests/test_studio_authenticated_canary.py \
                   tests/test_studio_metadata_contract.py \
                   tests/test_studio_metadata_operations.py \
                   tests/test_studio_metadata_provider.py \
                   tests/test_studio_voice_sweep_job.py \
                   tests/test_sf360.py \
                   tests/test_org_publish.py \
                   tests/test_agent_waker.py \
                   tests/test_board_governor.py; do
            if [ -f "$t" ]; then echo "present : $t"; else echo "absent  : $t"; fi
          done

      # Each suite is its own step so a failure names the suite in the UI rather
      # than hiding inside a loop. `if [ -f ]` because the two suites arrive on
      # different branches; a branch carrying only one must not fail on the
      # other's absence.
      # Each suite runs inside an EMPTY NETWORK NAMESPACE (`unshare -n`), so
      # "these tests need no network" is proved by execution rather than
      # asserted. If a future edit adds a real call, the suite fails here.
      #
      # The first version of this workflow grepped the suites for "urlopen" and
      # friends instead. It failed immediately - on a test whose whole job is to
      # assert that the ENGINE contains exactly one urlopen, so the word appears
      # in a string literal. A substring cannot tell "calls urlopen" from
      # "asserts about urlopen", and the behavioural check does not have to.
      - name: xray-score-v1 (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_xray_score.py ]; then
            sudo unshare -n python3 tests/test_xray_score.py
          else
            echo "not on this branch; skipping"
          fi

      - name: open_for_me (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_open_for_me.py ]; then
            sudo unshare -n python3 tests/test_open_for_me.py
          else
            echo "not on this branch; skipping"
          fi

      - name: bus_benchmark (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_bus_benchmark.py ]; then
            sudo unshare -n python3 tests/test_bus_benchmark.py
          else
            echo "not on this branch; skipping"
          fi

      - name: append payload guard (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_append_payload_guard.py ]; then
            sudo unshare -n python3 tests/test_append_payload_guard.py
          else
            echo "not on this branch; skipping"
          fi

      - name: bcb linter (no network)
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          sudo unshare -n -- "$python_bin" tests/test_bcb_lint.py

      # The governor's FACT EXTRACTOR and OUTPUT PARSER only.
      #
      # The CLIPS engine itself is deliberately NOT covered here: governor.py
      # shells out to CLIPSDOS.exe under C:\Program Files, which cannot exist on
      # ubuntu-latest. The suite says that in its own docstring rather than
      # skipping the engine while reporting green, and the rules are exercised by
      # tests/mutate_board_governor.py on a machine that has CLIPS. So this check
      # means "the facts and the contract lines are right", never "the governor
      # works" - a distinction this workflow exists to keep honest.
      - name: board governor facts and parser (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_board_governor.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_board_governor.py
          else
            echo "not on this branch; skipping"
          fi

      # clasp push from this repo would delete grok routing from the live
      # site: the push target has none, and ten live replies on 2026-09-20
      # all came back by=grok. Both files share a version header, so nothing
      # warns you. While that is true, a document must say so.
      - name: clasp target is not silently behind live (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_clasp_target_is_current.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_clasp_target_is_current.py
          else
            echo "not on this branch; skipping"
          fi

      # The consultation log filed a route header as gemini's opinion, twice,
      # for two different console reasons. The adapter is called in-process
      # now and a blank can never become a record.
      - name: consult never files a blank (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_consult_never_files_a_blank.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_consult_never_files_a_blank.py
          else
            echo "not on this branch; skipping"
          fi

      # A row that fails once must still be there on the next pass.
      # chatgpt-codex-desktop found the watermark advancing past a failed
      # row with a live repro; the row then fell out of the window for ever.
      - name: waker watermark floor and adapter signature (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_waker_watermark.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_waker_watermark.py
          else
            echo "not on this branch; skipping"
          fi

      - name: waker WhatsApp acknowledgement state contract (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_board_waker_ack.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_board_waker_ack.py
          else
            echo "not on this branch; skipping"
          fi

      # The dependency check that did not exist. agent_waker.py reached main
      # naming three adapter modules and shelling out to a fourth file, none
      # of which were in the repository, and passed every check twice -
      # because its own suite injects fake adapters on purpose.
      - name: waker dependencies are actually present (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_waker_dependencies.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_waker_dependencies.py
          else
            echo "not on this branch; skipping"
          fi

      # The Foundry adapter's own contract suite.
      - name: foundry host contract (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_foundry_host.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_foundry_host.py
          else
            echo "not on this branch; skipping"
          fi

      # Inbound WhatsApp media. The board records an id and nothing else, so
      # a voice note addressed to an agent by name sat unread for seventeen
      # hours. This suite pins the one rule that made it readable: the row's
      # declared type is a claim, the magic bytes are the measurement.
      - name: whatsapp media typing (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_wa_media.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_wa_media.py
          else
            echo "not on this branch; skipping"
          fi

      # Board → WhatsApp outbox. Agents post phase=WA_SEND; the laptop
      # watcher is what calls wa_notify.ps1. This suite is the parser,
      # the prime-don't-blast-history rule, and the Governor-only lock.
      # It never opens a socket and never reads .env.
      - name: whatsapp board outbox contract (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_wa_board_outbox.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_wa_board_outbox.py
          else
            echo "not on this branch; skipping"
          fi

      # The Python replacement for wa_notify.ps1, and the poller that now calls
      # it instead of powershell.exe. Offline by construction: every credential
      # test writes its own throwaway env file and passes it explicitly, so the
      # suite cannot read the operator's .env even by accident, and send() is
      # reached only through a patched urlopen.
      #
      # The class that matters is ForgeTheIdentityLine. The "[KIND - tag]" line
      # is how Mr Salam tells one instance from another, and the port shipped
      # without the tag grammar the .ps1 enforces - so a tag of "x]\nDONE - grok"
      # composed a second, convincing prefix. Eight forgeries are attempted here
      # rather than asserting the guard exists.
      #
      # TheTwoImplementationsAgree reads BOTH sources and fails if the Graph
      # version, the character cap, the tag grammar or the shape of the identity
      # line stop matching. Two copies of one contract drift; nothing else here
      # would notice.
      - name: whatsapp notifier contract and identity forgery (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_wa_notify.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_wa_notify.py
          else
            echo "not on this branch; skipping"
          fi

      # The claim the whole cloud migration rests on: the unattended clients
      # start without a laptop-specific credential path.
      #
      # #172 deleted a hardcoded C:\Users\salam\Quantum\Blackboard\.env
      # fallback from board_waker.py and replaced it with an injected
      # BUS_URL/BUS_SECRET pair, or a file named by BLACKBOARD_ENV. The live
      # scheduled launcher already sets BLACKBOARD_ENV, so nothing broke - but
      # that fallback existed because the waker checkout has no .env of its own
      # and the first scheduled dry run died on it. If the resolution order
      # regresses, this suite is the only thing that says so, and it arrived
      # named in no workflow at all.
      #
      # Offline by construction: every case patches os.environ and points the
      # loader at a path that does not exist.
      - name: cloud runtime credential contract (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_cloud_runtime_contract.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_cloud_runtime_contract.py
          else
            echo "not on this branch; skipping"
          fi

      # THE DOORBELL ITSELF. run-waker.ps1 decides whether to start a model
      # purely from this peek's exit code - 10 wakes, 0 is a quiet board, and
      # anything else is logged as ABORT and waited on. So a bug that changes
      # the exit code does not look like an error; it looks like silence.
      #
      # Three such bugs were live on 2026-09-23, all producing a non-0, non-10
      # exit:
      #   - one row written by vm-chrome on 2026-09-03, whose timestamp cell
      #     holds a BCB payload, made check_board return UNKNOWN for the whole
      #     read. Permanent history, so the gate could never open again.
      #   - a board UNKNOWN was checked before NEWS, so a WhatsApp message from
      #     Mr Salam produced a combined UNKNOWN and no wake. Six of his
      #     messages were sitting behind that.
      #   - printing a fresh row containing U+2192 raised UnicodeEncodeError on
      #     a cp1252 console.
      #
      # The suite reverts the fix to the pre-fix file as a negative control, so
      # it cannot pass against the bug it was written for.
      - name: waker peek verdict and exit codes (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_waker_peek_verdict.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_waker_peek_verdict.py
          else
            echo "not on this branch; skipping"
          fi

      # The cloud probe runs unattended in a container holding live bus
      # credentials, and ONE function stands between that and a write. This
      # suite attacks that function rather than admiring it: eight ways to
      # smuggle a write past it, including an action hidden behind a variable
      # and a params dict built elsewhere.
      #
      # It also pins the bug that produced the guard. The first version scanned
      # string literals for write words and REFUSED THE PROBE, because its own
      # error message contained "write" - the third time this repo has been
      # caught by a substring standing in for a question about behaviour.
      - name: cloud probe cannot write (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_board_probe_readonly.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_board_probe_readonly.py
          else
            echo "not on this branch; skipping"
          fi

      - name: a slow board read is a failed attempt, not a crash - probe (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_board_probe_read_retry.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_board_probe_read_retry.py
          else
            echo "not on this branch; skipping"
          fi

      - name: a slow board read is a failed attempt, not a crash - read_since (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_read_since_retry.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_read_since_retry.py
          else
            echo "not on this branch; skipping"
          fi

      - name: governor live check compares every file on a pinned main (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_governor_live_check.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_governor_live_check.py
          else
            echo "not on this branch; skipping"
          fi

      # Durable fleet state, and the half that has actually cost incidents.
      #
      # Durability is easy; two writers touching one cursor is not. Two surfaces
      # under one tag is the collision class behind three incidents here, so this
      # suite RACES the store against itself with a fake GCS that implements real
      # ifGenerationMatch semantics - a fake that always accepted a write would
      # make every case pass while proving nothing.
      #
      # It also pins that a corrupt state document is refused rather than read as
      # empty. An empty cursor means re-answering the whole board.
      - name: durable state, compare-and-swap and never backwards (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_state_store.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_state_store.py
          else
            echo "not on this branch; skipping"
          fi

      # The shadow waker runs the LIVE doorbell's decision logic in a
      # container. Two properties, both attacked rather than asserted:
      #
      #   it cannot write - an AST guard refuses every waker write path by name
      #   AND every waker function not on a two-item allowlist, so a new writer
      #   added to board_waker tomorrow fails without anyone updating a denylist.
      #
      #   it agrees with the laptop - the verdict rule is NEWS-first, which is
      #   what #186 established after a board UNKNOWN swallowed seven of Mr
      #   Salam's WhatsApp messages. The rule is duplicated (board_waker's lives
      #   inline in main()), so one test reads BOTH sources and fails if the
      #   order diverges.
      #
      # Also pinned: prose about writing does not fail the guard. A substring
      # check stood in for a question about behaviour four times in one session,
      # including reporting the waker's peek branch as containing a board append
      # when the match was the word "appended" in a comment.
      - name: shadow waker cannot write and agrees with the laptop (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_waker_shadow.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_waker_shadow.py
          else
            echo "not on this branch; skipping"
          fi

      # The cloud fleet since 2026-09-24: one board watcher starting agent and
      # outbox jobs. What these pin is what would land on Mr Salam's phone or
      # the board twice: a killed run resending, two ticks starting one job,
      # a routing error read as "not for me". ack-once, the one-shot first
      # cloud write, was retired the same day and its suite with it.
      - name: "board watcher: one tick, no dropped or doubled ring (no network)"
        run: |
          set -euo pipefail
          if [ -f tests/test_board_watcher.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" -m unittest tests.test_board_watcher
          else
            echo "not on this branch; skipping"
          fi

      - name: "cloud WhatsApp outbox: never twice, never to anyone else (no network)"
        run: |
          set -euo pipefail
          if [ -f tests/test_wa_outbox_cloud.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" -m unittest tests.test_wa_outbox_cloud
          else
            echo "not on this branch; skipping"
          fi

      - name: "cloud agent waker: durable cursor, no double answer (no network)"
        run: |
          set -euo pipefail
          if [ -f tests/test_gemini_cloud_waker.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" -m unittest tests.test_gemini_cloud_waker
          else
            echo "not on this branch; skipping"
          fi

      # The soak judge, which is the evidence cutover step 8 would be decided
      # on - step 8 being Mr Salam disabling the laptop scheduler. A judge that
      # cannot fail is worse than no judge, so every criterion here is tested by
      # feeding it a window that breaks exactly that one, against a CLEAN CONTROL
      # window that must produce no findings at all.
      #
      # The property that matters most: NOT YET must never round up to PASS.
      # Pinned by a regression - the first version measured the whole 48-hour
      # window regardless of when the soak began, so minutes after starting it
      # reported FAIL with 44 missing hours from before the jobs existed.
      - name: the soak judge can fail, and NOT YET is not a pass (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_soak_report.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_soak_report.py
          else
            echo "not on this branch; skipping"
          fi

      # The doorbell that answers board rows as foundry, gemini or grok.
      #
      # It shipped with NO hosted check at all: the budget bug that turned
      # every Foundry reply into an empty thinking block passed five green
      # ticks, because not one of them ran this suite. Offline by
      # construction - the adapters are reached only through fake modules
      # injected into sys.modules, and the board read lives in main(),
      # which the suite never calls.
      - name: agent waker addressing, budget and dedupe (no network)
        run: |
          set -euo pipefail
          if [ -f tests/test_agent_waker.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" tests/test_agent_waker.py
          else
            echo "not on this branch; skipping"
          fi

      # FastAPI and its in-process TestClient are needed only by the controller
      # suite. Installation happens before the network namespace is removed;
      # the suite itself still runs with no network and all provider clients
      # are fakes.
      - name: Install pinned Studio controller test dependencies
        if: ${{ hashFiles('tests/test_studio_controller.py') != '' || hashFiles('tests/test_studio_auth.py') != '' || hashFiles('tests/test_studio_authenticated_canary.py') != '' }}
        # The controller's own pins, so CI tests what the image installs -
        # including the anthropic SDK that STUDIO_WORKER=claude imports.
        run: python3 -m pip install -r cloud/studio-controller/requirements.txt

      - name: "studio controller: CAS, idempotency, replay and auth (no network)"
        run: |
          set -euo pipefail
          if [ -f tests/test_studio_controller.py ] && [ -f tests/test_studio_auth.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" -m unittest \
              tests.test_studio_auth tests.test_studio_controller tests.test_studio_lead_facts \
              tests.test_studio_lead_deadline tests.test_studio_metadata_contract \
              tests.test_studio_voice_sweep_job
          else
            echo "not on this branch; skipping"
          fi

      # The live CLI is inert unless an operator supplies --live, an exact
      # canary Cloud Run target, hidden email/OTP, and an independent same-org
      # Lead receipt. CI uses MockTransport with the network namespace removed;
      # it proves request cardinality, redaction, replay, SSE and Stop contracts
      # without sending mail, authenticating, querying Salesforce, or writing.
      - name: "studio authenticated Lead API canary contract (no network)"
        run: |
          set -euo pipefail
          test -f cloud/studio-controller/tools/authenticated_canary.py
          test -f tests/test_studio_authenticated_canary.py
          python_bin="$(command -v python3)"
          sudo unshare -n -- "$python_bin" -m unittest tests.test_studio_authenticated_canary

      - name: "studio metadata operation ledger: atomic holds and no-retry contracts (no network)"
        run: |
          set -euo pipefail
          test -f cloud/studio-controller/app/metadata_operations.py
          test -f tests/test_studio_metadata_operations.py
          python_bin="$(command -v python3)"
          sudo unshare -n -- "$python_bin" -m unittest tests.test_studio_metadata_operations

      # A provider-shaped module is more dangerous than an ordinary helper:
      # it can turn a replay bug into an external write. This suite runs with
      # the network namespace removed, requires both implementation and tests,
      # and attacks the one-use permit, whole-operation budget, cancellation,
      # exact provider shapes and ambiguous-outcome quarantine.
      - name: "studio metadata provider: sealed one-shot contract (no network)"
        run: |
          set -euo pipefail
          test -f cloud/studio-controller/app/metadata_provider.py
          test -f tests/test_studio_metadata_provider.py
          python_bin="$(command -v python3)"
          sudo unshare -n -- "$python_bin" -m unittest tests.test_studio_metadata_provider

      - name: "studio email sender: signed request and replay refusal (no network)"
        run: |
          set -euo pipefail
          if [ -f tests/test_studio_email_sender.cjs ]; then
            node --test tests/test_studio_email_sender.cjs
          else
            echo "not on this branch; skipping"
          fi

      # The studio's Claude worker: model output is data, checked before it can
      # reach a visitor. A fake client drives it; no network, no key, no SDK import.
      - name: "studio Claude worker: model output gated before the page (no network)"
        run: |
          set -euo pipefail
          if [ -f tests/test_studio_claude_worker.py ]; then
            python_bin="$(command -v python3)"
            sudo unshare -n -- "$python_bin" -m unittest tests.test_studio_claude_worker tests.test_studio_org_facts
          else
            echo "not on this branch; skipping"
          fi

      # The bus suite starts its own server and scratch database. Enable only
      # loopback in a fresh namespace, and retain setup-python's exact binary
      # across sudo rather than silently switching to the system interpreter.
      - name: bus API and migration imports (isolated loopback)
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          sudo unshare -n -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec "$1" tests/test_bus.py src/bus_server.py
          ' _ "$python_bin"

      # A workflow that skips everything and reports success is the failure mode
      # this file exists to prevent. If no eligible suite is present, fail.
      - name: Refuse a green tick over nothing
        run: |
          set -euo pipefail
          if [ ! -f tests/test_xray_score.py ] && [ ! -f tests/test_open_for_me.py ] \
             && [ ! -f tests/test_bus_benchmark.py ] && [ ! -f tests/test_append_payload_guard.py ] \
             && [ ! -f tests/test_bus.py ] && [ ! -f tests/test_bcb_lint.py ] \
             && [ ! -f tests/test_clasp_target_is_current.py ] \
             && [ ! -f tests/test_consult_never_files_a_blank.py ] \
             && [ ! -f tests/test_waker_watermark.py ] \
             && [ ! -f tests/test_board_waker_ack.py ] \
             && [ ! -f tests/test_waker_dependencies.py ] \
             && [ ! -f tests/test_wa_media.py ] \
             && [ ! -f tests/test_wa_board_outbox.py ] \
             && [ ! -f tests/test_wa_notify.py ] \
             && [ ! -f tests/test_cloud_runtime_contract.py ] \
             && [ ! -f tests/test_waker_peek_verdict.py ] \
             && [ ! -f tests/test_board_probe_readonly.py ] \
             && [ ! -f tests/test_state_store.py ] \
             && [ ! -f tests/test_waker_shadow.py ] \
             && [ ! -f tests/test_board_watcher.py ] \
             && [ ! -f tests/test_wa_outbox_cloud.py ] \
             && [ ! -f tests/test_gemini_cloud_waker.py ] \
             && [ ! -f tests/test_soak_report.py ] \
             && [ ! -f tests/test_studio_controller.py ] \
             && [ ! -f tests/test_studio_auth.py ] \
             && [ ! -f tests/test_studio_email_sender.cjs ] \
             && [ ! -f tests/test_studio_claude_worker.py ] \
             && [ ! -f tests/test_studio_org_facts.py ] \
             && [ ! -f tests/test_studio_lead_facts.py ] \
             && [ ! -f tests/test_studio_lead_deadline.py ] \
             && [ ! -f tests/test_studio_authenticated_canary.py ] \
             && [ ! -f tests/test_studio_metadata_contract.py ] \
             && [ ! -f tests/test_studio_metadata_operations.py ] \
             && [ ! -f tests/test_studio_metadata_provider.py ] \
             && [ ! -f tests/test_agent_waker.py ] \
             && [ ! -f tests/test_board_governor.py ]; then
            echo "No eligible suite is present, so this check proved nothing." >&2
            echo "A passing check over zero assertions is worse than no check." >&2
            exit 1
          fi
          echo "at least one eligible suite is present"

      # The dev-org rail (scripts/sf360.py) and the /org/ snapshot publisher
      # (scripts/org_publish.py, org_diff_guard.py). Script-style suites that
      # print passed=/failed= and exit 1 on any failure. Salesforce is faked;
      # the rail's HTTP section serves itself on 127.0.0.1, so only loopback
      # is enabled in the fresh namespace, as for the bus suite below.
      # Until 2026-09-24 no workflow ran them.
      - name: "dev-org rail and snapshot publisher (isolated loopback)"
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          sudo unshare -n -- bash -c '
            set -euo pipefail
            ip link set lo up
            "$1" tests/test_sf360.py
            "$1" tests/test_org_publish.py
          ' _ "$python_bin"

      # A negative control for the isolation itself. If `unshare -n` silently
      # stopped isolating, every "no network" claim above would be worthless and
      # nothing would say so.
      - name: Prove the isolation actually isolates
        run: |
          set -euo pipefail
          if sudo unshare -n python3 -c "import urllib.request; urllib.request.urlopen('http://example.com', timeout=5)" 2>/dev/null; then
            echo "unshare -n did NOT isolate the network; the offline claims above prove nothing" >&2
            exit 1
          fi
          echo "confirmed: no network inside the namespace the suites ran in"
