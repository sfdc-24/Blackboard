# Hosted CI for the self-contained Python suites.
#
# WHY THIS EXISTS
#   Both PR55 (xray-score-v1) and PR56 (open_for_me) were blocked on the same
#   finding: the suites pass when run directly and there is no hosted check, so
#   a reviewer has to take the author's word for a number. "Green is not proof"
#   cuts both ways - an unrunnable test is not evidence either.
#
# WHY IT RUNS THE FILES DIRECTLY
#   These suites are plain scripts that print results and call sys.exit(1) on
#   failure. `unittest discover` does NOT collect them and exits 0 having run
#   nothing, which is worse than no CI: a green tick over zero assertions.
#   Running the file is what actually honours its exit code.
#
# WHY EACH SUITE IS NAMED RATHER THAN GLOBBED
#   tests/ also holds node:test suites, PowerShell suites and network-touching
#   scripts. A glob would drag those in and either fail or, worse, make a
#   network call from CI. Every suite listed here is offline by construction -
#   no remote org, board, bus, or credentials - and that is PROVED by running
#   them in an empty network namespace rather than asserted in a comment.
name: python-suites

on:
  pull_request:
    paths:
      - "scripts/xray_score.py"
      - "scripts/open_for_me.py"
      - "tests/test_xray_score.py"
      - "tests/test_open_for_me.py"
      - "scripts/bus_benchmark.py"
      - "tests/test_bus_benchmark.py"
      - "scripts/append.py"
      - "tests/test_append_payload_guard.py"
      - "src/bus_server.py"
      - "tests/test_bus.py"
      - "scripts/bcb_lint.py"
      - "tests/test_bcb_lint.py"
      - "scripts/foundry_agent.py"
      - "scripts/gemini_agent.py"
      - "scripts/grok_agent.py"
      - "scripts/claude_agent.py"
      - "scripts/fleet_agent.py"
      - ".clasp.json"
      - "apps-script/governor-page-api/Code.js"
      - "docs/APPS-SCRIPT-DEPLOY.md"
      - "tests/test_clasp_target_is_current.py"
      - "scripts/consult.py"
      - "tests/test_consult_never_files_a_blank.py"
      - "tests/test_waker_watermark.py"
      - "scripts/board_waker.py"
      - "tests/test_board_waker_ack.py"
      - "tests/test_waker_dependencies.py"
      - "tests/test_foundry_host.py"
      - "scripts/wa_media.py"
      - "tests/test_wa_media.py"
      - "scripts/wa_board_outbox.py"
      - "scripts/wa_board_outbox.ps1"
      - "tests/test_wa_board_outbox.py"
      - "scripts/wa_notify.py"
      - "tests/test_wa_notify.py"
      - "scripts/grok_wa_inbox.py"
      - "tests/test_cloud_runtime_contract.py"
      - "scripts/board_waker.py"
      - "scripts/board_say.py"
      - "tests/test_waker_peek_verdict.py"
      - "tests/test_board_probe_readonly.py"
      - "tests/test_state_store.py"
      - "scripts/state_store.py"
      - "cloud/board-probe/main.py"
      - "tests/fixtures/wa_outbox_rows.json"
      - "scripts/agent_waker.py"
      - "tests/test_agent_waker.py"
      - "tools/board_governor/board_facts.py"
      - "tools/board_governor/governor.py"
      - "tests/test_board_governor.py"
