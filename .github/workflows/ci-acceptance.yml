name: CI acceptance (offline)

on:
  pull_request:
    paths:
      - '.clasp.json'
      - '.gitignore'
      - 'docs/CICD.md'
      - 'docs/HANDOVER.md'
      - 'scripts/gas_version_assert.py'
      - 'scripts/gas_deployment_audit.py'
      - 'scripts/gas_baseline_check.py'
      - 'scripts/gas_drift_watch.ps1'
      - 'scripts/alpha.ps1'
      - 'tests/test_gas_*_acceptance.py'
      - 'apps-script/governor-page-api/Auth.js'
      - 'apps-script/governor-page-api/Reception.html'
      - 'apps-script/governor-page-api/PublicInbox.js'
      - 'site/voice/index.html'
      - 'scripts/gas_create_staging.sh'
      - 'tests/test_governor_auth.cjs'
      - 'tests/test_governor_tenant_boundary.cjs'
      - 'tests/test_staging_helpers.py'
      - 'scripts/gas_staging_target.py'
      - 'scripts/gas_build_identity.py'
      - 'scripts/baseline_verify.py'
      - 'tests/test_baseline_verify.py'
      - 'tests/test_gas_baseline_check.py'
      - 'tests/fixtures/governor-v31-manifest.json'
      - 'scripts/gas_tts_canary.py'
      - 'scripts/gas_tts_canary_target.json'
      - 'tests/test_build_identity.py'
      - 'tests/test_tts_canary_contract.py'
      - 'tests/fixtures/site-p0-tts-canary.gs.template'
      - 'tests/test_governor_voice.cjs'
      - 'tests/test_reception_popblock.cjs'
      - 'docs/SITE-P0-TTS-CANARY.md'
      - 'tests/test_build_health.cjs'
      - 'apps-script/governor-page-api/Code.js'
      - 'apps-script/governor-page-api/Monitor.js'
      - 'apps-script/governor-page-api/appsscript.json'
      - 'tests/test_governor_v30.cjs'
      - 'tests/test_governor_v31.cjs'
      - 'apps-script/glasses-intake-uploader/Code.gs'
      - 'scripts/gas_staging_targets.json'
      - 'tests/test_staging_target.py'
      - 'tests/test_clasp_json_contract.cjs'
      - 'tests/test_deploy_source_contract.py'
      - 'docs/FOUNDRY_WORKER_CONTRACT.md'
      - 'scripts/ask_foundry.py'
      - 'tests/test_ask_foundry.py'
      - 'tooling/clasp/**'
      - 'scripts/claude_board_worker.ps1'
      - 'scripts/pudding_harness.py'
      - 'scripts/snow.ps1'
      - 'scripts/wa_notify.ps1'
      - 'scripts/board_waker.py'
      - 'tests/test_board_waker_ack.py'
      - 'scripts/wa_board_outbox.py'
      - 'scripts/wa_board_outbox.ps1'
      - 'tests/test_wa_board_outbox.py'
      - 'scripts/wa_watch.ps1'
      - 'scripts/README-board-clients.md'
      - 'scripts/append.py'
      - 'scripts/board_summary.py'
      - 'scripts/bus.py'
      - 'scripts/env_check.py'
      - 'scripts/show_row.py'
      - 'scripts/tail_full.py'
      - 'tests/test_board_clients.py'
      - 'tests/test_operator_script_guards.py'
      - '.github/workflows/staging-deploy.yml'
      - '.github/workflows/staging-rollback.yml'
      - '.github/workflows/ci-acceptance.yml'

permissions:
  contents: read

jobs:
  offline-acceptance:
    name: Validator and deployment audit unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run offline acceptance tests
        env:
          GAS_VERSION_ASSERT_PATH: scripts/gas_version_assert.py
          GAS_DEPLOYMENT_AUDIT_PATH: scripts/gas_deployment_audit.py
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p 'test_gas_*_acceptance.py' -v
      - name: Test staging helper and push change detection with local fixtures
        run: python -B -m unittest discover -s tests -p 'test_staging_helpers.py' -v
      - name: Test staging target binding and workflow mutation gates
        run: python -B -m unittest discover -s tests -p 'test_staging_target.py' -v
      - name: Test operator helper trust boundaries
        run: python -B -m unittest discover -s tests -p 'test_operator_script_guards.py' -v
      - name: Test WhatsApp board outbox contract
        run: python -B -m unittest discover -s tests -p 'test_wa_board_outbox.py' -v
      - name: Test scheduled waker WhatsApp acknowledgement contract
        run: python -B -m unittest discover -s tests -p 'test_board_waker_ack.py' -v
      - name: Test board client read and append safety contracts
        run: python -B -m unittest discover -s tests -p 'test_board_clients.py' -v
      - name: Test single production deploy source contract
        run: python -B -m unittest discover -s tests -p 'test_deploy_source_contract.py' -v
      - name: Test governed Foundry evaluator contract
        run: python -B -m unittest discover -s tests -p 'test_ask_foundry.py' -v
      - name: Test immutable source and runtime build proof without live APIs
        run: |
          python -B -m unittest discover -s tests -p 'test_build_identity.py' -v
          python -B -m unittest discover -s tests -p 'test_baseline_verify.py' -v
          python -B -m unittest discover -s tests -p 'test_gas_baseline_check.py' -v
          node --test tests/test_build_health.cjs
      - name: Test isolated TTS canary build, target and receipt contracts
        run: |
          python -B -m unittest discover -s tests -p 'test_tts_canary_contract.py' -v
          node --test tests/test_governor_voice.cjs
      - name: Verify locked clasp installation without deployment credentials
        run: |
          npm ci --prefix tooling/clasp --ignore-scripts --no-audit --no-fund
          test "$(tooling/clasp/node_modules/.bin/clasp --version)" = '3.4.1'
          node --test tests/test_clasp_json_contract.cjs
      - name: Test Google callback claims with mocked token exchange
        run: node --test tests/test_governor_auth.cjs tests/test_governor_tenant_boundary.cjs tests/test_governor_v30.cjs tests/test_governor_v31.cjs

      # tests/test_reception_popblock.cjs arrived with this PR and NO workflow
      # referenced it, so all three of the PR's green checks passed without ever
      # loading it. That is PR74's failure a third time: a committed test that no
      # job invokes is not coverage, it is a file that happens to hold assertions.
      #
      # It belongs here rather than in governor-voice because it exercises
      # Reception.html's DOM behaviour, which is what the other governor .cjs
      # suites in this job cover.
      - name: Test the reception voice-link block
        run: node --test tests/test_reception_popblock.cjs

      # scripts/gas_baseline_check.py has compared the committed mirror against
      # deployed source since 2026-09-06, and NO workflow has ever invoked it.
      # On 2026-09-13 the same drift it was written to catch was rediscovered by
      # hand, one `clasp push` away from reverting the live Governor console.
      #
      # This step cannot read deployed source - that needs production
      # credentials CI does not have and should not be given lightly. What it
      # CAN check is the wrapper's decision table, and the assertion that earns
      # its place is that a fetch returning ZERO files is reported UNKNOWN
      # rather than IN_SYNC: an empty comparison finds no differences, which is
      # the shape of a pass and the substance of a run that never happened.
      - name: Apps Script drift-watch decision contracts
        shell: bash
        run: |
          set -euo pipefail
          command -v pwsh >/dev/null || { echo "pwsh is not on this runner" >&2; exit 1; }
          output=$(pwsh -NoProfile -File scripts/gas_drift_watch.ps1 -SelfTest)
          echo "$output"
          # Assert the exit code rather than inheriting it, and assert the
          # summary separately - a green summary over a red exit and a red
          # summary over a green exit are the same disease facing opposite ways.
          result=$(printf '%s\n' "$output" | grep -c '^RESULT passed=' || true)
          test "$result" -eq 1 || { echo "expected exactly one RESULT line, got $result" >&2; exit 1; }
          printf '%s\n' "$output" | grep -q '^RESULT passed=[0-9]* failed=0$' \
            || { echo "the suite reported failures" >&2; exit 1; }
          # Refuse a green tick over nothing. Two of the eleven assertions are
          # Windows-only and announce themselves as skipped on Linux, so nine is
          # the floor here, not eleven.
          count=$(printf '%s\n' "$output" | sed -n 's/^RESULT passed=\([0-9]*\) .*/\1/p')
          test "${count:-0}" -ge 9 \
            || { echo "only ${count:-0} assertions ran; this suite should have at least 9 on Linux" >&2; exit 1; }
