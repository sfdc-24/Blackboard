name: WhatsApp gateway contract tests

on:
  pull_request:
    paths:
      - 'scripts/pipedream_wa_*.js'
      - 'tests/test_whatsapp_gateway.cjs'
      - 'tests/helpers/pipedream_loader.cjs'
      - '.github/workflows/whatsapp-gateway-tests.yml'

permissions:
  contents: read

jobs:
  gateway-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/test_whatsapp_gateway.cjs
