# Fail-safe for inbox wake. Every 15 minutes, ask the scale-to-zero service to
# read fleet:inbox:* and wake anything the webhook missed.
#
# SHIPPED OFF. The job runs only when INBOX_WAKE_ENABLED is exactly "on" and
# INBOX_WAKE_URL is set. The bearer is a secret the owner creates; this file
# does not contain it. No min-instances, no Cloud Scheduler job.
name: inbox-wake-sweep

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    if: vars.INBOX_WAKE_ENABLED == 'on' && vars.INBOX_WAKE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sweep missed inbox messages
        env:
          SERVICE: ${{ vars.INBOX_WAKE_URL }}
          TOKEN: ${{ secrets.INBOX_WAKE_SWEEP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "INBOX_WAKE_SWEEP_TOKEN is unset; not calling the service"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "${SERVICE}/sweep"
