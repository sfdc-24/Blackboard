name: Beat-1 prototype (offline)

on:
  pull_request:
    paths:
      - "prototype/beat1/**"
      - "tests/test_beat1_history.js"
      - "tests/test_beat1_provider.js"
      - "tests/test_beat1_runtime.js"
      - "tests/test_build_page.js"
      - "tests/test_sketch_contract.js"
      - "tests/test_domain_lookup.js"
      - ".github/workflows/beat1-prototype-tests.yml"

permissions:
  contents: read

jobs:
  beat1-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run Beat-1 offline contract and runtime tests
        run: |
          node --check prototype/beat1/domains.js
          node --check prototype/beat1/serve.js
          node --check prototype/beat1/sketch.js
          node --check prototype/beat1/build.js
          node --check prototype/beat1/history.js
          node tests/test_sketch_contract.js
          node tests/test_build_page.js
          node tests/test_beat1_history.js
          node tests/test_beat1_provider.js
          node tests/test_beat1_runtime.js
          node tests/test_domain_lookup.js
