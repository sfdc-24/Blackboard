name: Deploy Apps Script to STAGING

# VM-CICD-001 · STEP_3. STAGING ONLY — this workflow never touches a
# production deployment id. Production deploys remain manual until
# Mr. Salam ratifies otherwise.
#
# Required repo secrets (see docs/CICD.md):
#   CLASPRC_JSON          — contents of ~/.clasprc.json from an authenticated clasp login
# Required repo variables (per project, created in STEP_2):
#   STAGING_SCRIPT_ID_<PROJECT>       — Apps Script scriptId of the STAGING copy
#   STAGING_DEPLOYMENT_ID_<PROJECT>   — the stable web-app deployment id on that copy
#   STAGING_EXEC_URL_<PROJECT>        — the /exec URL of that deployment (for the HTTP assertion)
#
# Assertion doctrine (commandment 1 + 3): HTTP 200 and "ok" output are NOT
# proof a deploy landed. Two independent read-backs:
#   1. clasp list-deployments must show the deployment at the NEW version.
#   2. The live GET must report the expected version; missing or invalid proof
#      fails closed. A contract version match is not source/build identity
#      evidence; that separate release gate remains open (docs/CICD.md).

on:
  push:
    branches: [staging]
    paths: ['apps-script/**']
  workflow_dispatch:
    inputs:
      project:
        description: 'Project dir under apps-script/ to deploy'
        required: true
        default: 'governor-page-api'
        type: choice
        options: [governor-page-api, blackboard-production, glasses-intake-uploader]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: staging-deploy-${{ matrix.project }}
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      matrix:
        project: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.project)) || fromJSON('["governor-page-api","blackboard-production","glasses-intake-uploader"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if project unchanged (push builds only)
        if: github.event_name == 'push'
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PROJECT: ${{ matrix.project }}
        run: |
          # A first push has an all-zero before SHA; a force push can remove
          # that commit from fetched history. In either case check every project.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- "apps-script/$PROJECT/"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 1 ] || { echo '::error::project diff failed'; exit "$status"; }
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.skip != 'true'
        with: { node-version: '22' }

      - name: Install clasp
        if: steps.changed.outputs.skip != 'true'
        run: |
          npm ci --prefix tooling/clasp --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tooling/clasp/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(tooling/clasp/node_modules/.bin/clasp --version)" = '3.4.1'

      - name: Authenticate clasp
        if: steps.changed.outputs.skip != 'true'
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          test -s ~/.clasprc.json || { echo '::error::CLASPRC_JSON secret is empty — complete the OAuth halt in docs/CICD.md first'; exit 1; }
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Resolve reviewed staging target
        if: steps.changed.outputs.skip != 'true'
        id: ids
        env:
          PROJECT: ${{ matrix.project }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: python3 scripts/gas_staging_target.py resolve >> "$GITHUB_OUTPUT"

      - name: Verify deployment belongs to the staging project before mutation
        if: steps.changed.outputs.skip != 'true'
        env:
          SCRIPT_ID: ${{ steps.ids.outputs.script_id }}
          DEPLOY_ID: ${{ steps.ids.outputs.deploy_id }}
        run: |
          clasp --json list-deployments "$SCRIPT_ID" |
            python3 scripts/gas_staging_target.py deployment

      - name: Push source to STAGING project
        if: steps.changed.outputs.skip != 'true'
        working-directory: apps-script/${{ matrix.project }}
        run: |
          printf '{"scriptId":"%s","rootDir":"."}\n' "${{ steps.ids.outputs.script_id }}" > .clasp.json
          clasp push -f

      - name: Create version and redeploy
        if: steps.changed.outputs.skip != 'true'
        id: ver
        working-directory: apps-script/${{ matrix.project }}
        env:
          DEPLOY_ID: ${{ steps.ids.outputs.deploy_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION=$(clasp --json create-version "ci: $COMMIT_SHA" |
            python3 "$GITHUB_WORKSPACE/scripts/gas_staging_target.py" created-version)
          clasp redeploy "$DEPLOY_ID" -V "$VERSION" -d "ci: $COMMIT_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 'ASSERT 1/2: exact staging deployment has the new version'
        if: steps.changed.outputs.skip != 'true'
        env:
          SCRIPT_ID: ${{ steps.ids.outputs.script_id }}
          DEPLOY_ID: ${{ steps.ids.outputs.deploy_id }}
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          clasp --json list-deployments "$SCRIPT_ID" |
            python3 scripts/gas_staging_target.py deployment --expect-version "$EXPECTED_VERSION"

      - name: 'ASSERT 2/2: live HTTP endpoint reports the new version'
        if: steps.changed.outputs.skip != 'true'
        run: |
          python3 scripts/gas_version_assert.py \
            --url "${{ steps.ids.outputs.exec_url }}" \
            --expect-version "${{ steps.ver.outputs.version }}" \
            --retries 6 --delay 10

      - name: Receipt
        if: steps.changed.outputs.skip != 'true'
        run: |
          echo "STAGING CHECK RECEIPT — source/build identity remains unverified" >> "$GITHUB_STEP_SUMMARY"
          echo "- project: ${{ matrix.project }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- staging deployment: ${{ steps.ids.outputs.deploy_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${{ steps.ver.outputs.version }} (asserted by list-deployments read-back + live GET)" >> "$GITHUB_STEP_SUMMARY"
