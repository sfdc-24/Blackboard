name: Alpha credential cleanup security

on:
  pull_request:
    paths:
      - 'scripts/alpha.ps1'
      - 'tests/test_alpha_security.ps1'
      - '.github/workflows/alpha-security.yml'

permissions:
  contents: read

jobs:
  alpha-security:
    name: ${{ matrix.identity }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - identity: Windows PowerShell 5.1
            runner: windows-2025
            engine: powershell.exe
            edition: Desktop
            platform: windows
          - identity: Windows PowerShell Core
            runner: windows-2025
            engine: pwsh.exe
            edition: Core
            platform: windows
          - identity: Linux PowerShell Core
            runner: ubuntu-24.04
            engine: pwsh
            edition: Core
            platform: linux

    steps:
      # Test the contributor's immutable head, not GitHub's synthetic merge ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact source and run offline cleanup acceptance
        shell: pwsh
        env:
          ALPHA_TEST_ENGINE: ${{ matrix.engine }}
          EXPECTED_EDITION: ${{ matrix.edition }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualHead = (git rev-parse HEAD).Trim()
          if ($actualHead -cne $env:EXPECTED_HEAD) {
            throw 'ALPHA_HEAD_IDENTITY_MISMATCH'
          }

          $alphaHash = (Get-FileHash -LiteralPath scripts/alpha.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $driverHash = (Get-FileHash -LiteralPath tests/test_alpha_security.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $alphaBlob = (git rev-parse 'HEAD:scripts/alpha.ps1').Trim()
          $driverBlob = (git rev-parse 'HEAD:tests/test_alpha_security.ps1').Trim()
          if ($alphaBlob -cnotmatch '^[0-9a-f]{40}$' -or $driverBlob -cnotmatch '^[0-9a-f]{40}$') {
            throw 'ALPHA_GIT_BLOB_IDENTITY_INVALID'
          }

          $engineCommand = Get-Command $env:ALPHA_TEST_ENGINE -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $enginePath = [IO.Path]::GetFullPath($engineCommand.Source)
          if (-not [IO.Path]::IsPathRooted($enginePath) -or -not (Test-Path -LiteralPath $enginePath -PathType Leaf)) {
            throw 'ALPHA_ENGINE_PATH_INVALID'
          }
          $driverArguments = @('-NoLogo', '-NoProfile', '-NonInteractive')
          if ($env:EXPECTED_PLATFORM -ceq 'windows') {
            $driverArguments += @('-ExecutionPolicy', 'Bypass')
          }
          $driverArguments += @('-File', 'tests/test_alpha_security.ps1')
          $records = @(& $enginePath @driverArguments *>&1)
          $driverExit = $LASTEXITCODE
          $lines = @($records | ForEach-Object { [string]$_ })
          if ($driverExit -ne 0) { throw 'ALPHA_SECURITY_DRIVER_NONZERO' }

          $enginePattern = '^DRIVER_ENGINE edition=' + [regex]::Escape($env:EXPECTED_EDITION) +
            ' version=(?<version>[0-9]+(?:\.[0-9]+){1,3}) platform=' + [regex]::Escape($env:EXPECTED_PLATFORM) + '$'
          $engineLines = @($lines | Where-Object { $_ -cmatch $enginePattern })
          $engineMatch = if ($engineLines.Count -eq 1) {
            [regex]::Match($engineLines[0], $enginePattern)
          } else {
            $null
          }
          if ($null -eq $engineMatch -or -not $engineMatch.Success) {
            throw 'ALPHA_ENGINE_IDENTITY_INVALID'
          }
          $runtimeVersion = [Version]$engineMatch.Groups['version'].Value
          if (($env:EXPECTED_EDITION -ceq 'Desktop' -and
               ($runtimeVersion.Major -ne 5 -or $runtimeVersion.Minor -ne 1)) -or
              ($env:EXPECTED_EDITION -ceq 'Core' -and $runtimeVersion.Major -lt 7)) {
            throw 'ALPHA_ENGINE_VERSION_INVALID'
          }
          if (@($lines | Where-Object { $_ -ceq 'DRIVER_CASES total=19' }).Count -ne 1) {
            throw 'ALPHA_DRIVER_CASE_COUNT_INVALID'
          }
          if (@($lines | Where-Object { $_ -ceq 'DRIVER_RESULT passed=19 failed=0' }).Count -ne 1 -or
              $lines[-1] -cne 'DRIVER_RESULT passed=19 failed=0') {
            throw 'ALPHA_DRIVER_RESULT_INVALID'
          }
          if (@($lines | Where-Object { $_ -like '*ALPHA_SECRET_CONFIG_CLEANUP_FAILED*' }).Count -ne 0) {
            throw 'ALPHA_DRIVER_EXPOSED_INTERNAL_FAILURE'
          }

          Write-Output "SOURCE head=$actualHead alpha_blob=$alphaBlob driver_blob=$driverBlob alpha_sha256=$alphaHash driver_sha256=$driverHash"
          Write-Output "RUNTIME engine=$enginePath edition=$($env:EXPECTED_EDITION) version=$runtimeVersion platform=$($env:EXPECTED_PLATFORM)"
          $lines | ForEach-Object { Write-Output $_ }
