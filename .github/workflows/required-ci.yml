name: required-ci

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same pull request cancels this workflow's older run.
# Group: workflow name, event, and pull request number (GitHub's id, not a
# branch name). Any other event uses a unique run id, so push, schedule,
# dispatch, and deploy are neither queued nor cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Always-green gate for branch protection
        run: |
          echo "required-ci ok"
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref }}"