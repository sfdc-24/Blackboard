<title>Org Fortune Cookie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Gloria+Hallelujah&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --lacquer:#171412; --lacquer-2:#221D1A; --edge:#3B322C;
    --ink:#F0EBE4; --ink-dim:#A79C90; --ink-faint:#71675E;
    --cookie:#D9A15B; --cookie-dark:#A9722F; --cookie-lit:#EFC183;
    --slip:#F6F0E2; --slip-ink:#241F1A; --lucky:#B5502F;
    --ui:"Archivo",system-ui,sans-serif;
    --hand:"Gloria Hallelujah",cursive;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --lacquer:#EFE9E0; --lacquer-2:#F8F4EC; --edge:#D6CCC0;
      --ink:#1C1916; --ink-dim:#5E554C; --ink-faint:#8B8177;
      --slip:#FFFBF2; --slip-ink:#241F1A; --lucky:#9C4326;
    }
  }
  :root[data-theme="light"]{
    --lacquer:#EFE9E0; --lacquer-2:#F8F4EC; --edge:#D6CCC0;
    --ink:#1C1916; --ink-dim:#5E554C; --ink-faint:#8B8177;
    --slip:#FFFBF2; --slip-ink:#241F1A; --lucky:#9C4326;
  }

  body{background:var(--lacquer);color:var(--ink);font-family:var(--ui);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:3rem 1.5rem 4rem;text-align:center}

  .eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--lucky);margin-bottom:.6rem}
  h1{font-family:var(--ui);font-weight:800;font-size:clamp(1.8rem,5vw,2.7rem);
     line-height:1.05;letter-spacing:-.02em;margin:0 0 .6rem;text-wrap:balance}
  .sub{color:var(--ink-dim);font-size:1rem;line-height:1.55;margin:0 auto 2.5rem;max-width:38ch}

  /* ---------- the cookie ---------- */
  .plate{position:relative;height:15rem;display:flex;align-items:center;
         justify-content:center;margin-bottom:.5rem}

  .cookie{position:relative;width:170px;height:120px;cursor:pointer;
          background:none;border:0;padding:0;transition:transform .18s}
  .cookie:hover{transform:scale(1.04) rotate(-2deg)}
  .cookie:active{transform:scale(.97)}
  .half{position:absolute;width:104px;height:104px;border-radius:50% 50% 46% 54%;
    background:radial-gradient(circle at 32% 28%,var(--cookie-lit),var(--cookie) 55%,var(--cookie-dark));
    box-shadow:inset -6px -8px 14px rgba(120,70,20,.45),0 8px 18px rgba(0,0,0,.35);
    transition:transform .5s cubic-bezier(.34,1.3,.5,1),opacity .4s}
  .half.l{left:2px;top:8px;transform:rotate(-14deg)}
  .half.r{right:2px;top:8px;transform:rotate(14deg) scaleX(-1)}
  .cookie.open .half.l{transform:rotate(-46deg) translate(-58px,26px)}
  .cookie.open .half.r{transform:rotate(46deg) scaleX(-1) translate(-58px,26px)}
  .crease{position:absolute;left:50%;top:6px;width:3px;height:108px;margin-left:-1.5px;
    background:linear-gradient(var(--cookie-dark),transparent);opacity:.7;
    transition:opacity .3s}
  .cookie.open .crease{opacity:0}

  .tap{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
       color:var(--ink-faint);margin-top:.2rem;transition:opacity .3s}
  .tap.hide{opacity:0}

  /* ---------- the slip ---------- */
  .slip{position:absolute;left:50%;top:50%;width:min(23rem,88%);
    transform:translate(-50%,-46%) scale(.6);opacity:0;pointer-events:none;
    background:var(--slip);color:var(--slip-ink);padding:1.5rem 1.4rem 1.2rem;
    border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.45);
    transition:transform .55s cubic-bezier(.2,1.1,.4,1),opacity .45s}
  .slip.show{opacity:1;transform:translate(-50%,-62%) scale(1) rotate(-1deg);pointer-events:auto}
  .slip .quote{font-family:var(--hand);font-size:1.16rem;line-height:1.62;
               text-wrap:balance;margin:0 0 1rem}
  .slip .rule{height:1px;background:rgba(36,31,26,.16);margin:.9rem 0 .7rem}
  .slip .lucky{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;
    color:var(--lucky);line-height:1.7;text-align:left}
  .slip .lucky span{color:rgba(36,31,26,.5)}

  .btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:4.5rem}
  button.act{font-family:var(--ui);font-weight:600;font-size:.88rem;padding:.6rem 1.2rem;
    border-radius:2px;border:1.5px solid var(--edge);background:transparent;
    color:var(--ink-dim);cursor:pointer;transition:border-color .15s,color .15s}
  button.act:hover{border-color:var(--ink-dim);color:var(--ink)}
  :focus-visible{outline:2px solid var(--lucky);outline-offset:3px}

  .foot{margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--edge);
    font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);line-height:1.8}
  .foot b{color:var(--ink-dim);font-weight:500}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="eyebrow">SFDC24</div>
  <h1>Crack one open.</h1>
  <p class="sub">Every org has a prophecy. Most of them are about Flows.</p>

  <div class="plate">
    <button class="cookie" id="cookie" aria-label="Crack open the fortune cookie">
      <span class="half l"></span><span class="half r"></span><span class="crease"></span>
    </button>
    <div class="slip" id="slip">
      <p class="quote" id="quote"></p>
      <div class="rule"></div>
      <div class="lucky"><span>Governor limits:</span> <span id="lucky"></span></div>
    </div>
  </div>

  <div class="tap" id="tap">tap the cookie</div>

  <div class="btns">
    <button class="act" id="again">Crack another</button>
  </div>

  <div class="foot">
    <b>Costs nothing.</b> No API call, no model, no tokens — it's a list and a bit of CSS.<br>
    Bots may crack as many as they like.
  </div>
</div>

<script>
(function(){
  var FORTUNES=[
    "A Flow you did not write will fail today. It is not your fault. You will fix it anyway.",
    "The report is correct. The data is not.",
    "Someone will describe a change as small. It is not small.",
    "Today you will discover a fifth source of truth.",
    "Four integrations write to that field. None of them know about each other.",
    "Every org has one Flow nobody will touch. It is usually named Test.",
    "A field called Notes__c holds your company's actual strategy.",
    "You will be asked to make it work more like Excel.",
    "The person who built this left in 2019 and documented nothing. Be kind to them anyway.",
    "Your validation rule will meet an edge case named Bob.",
    "Fourteen ways to log a case means fourteen people each solved it once.",
    "There is a sandbox that is more production than production.",
    "The integration works. Nobody remembers why.",
    "Someone deactivated a user who owned nine thousand records. Today you learn who.",
    "A picklist will grow a value called Other. Then a value called Other2.",
    "The requirement will change after the build and before the demo.",
    "You will spend an afternoon on something that turns out to be a cache.",
    "Two admins had the same good idea on the same object in the same week.",
    "The dashboard everyone loves is filtered wrong.",
    "A profile from 2017 still has Modify All. It is watching you.",
    "The urgent request will arrive at 4:52pm on a Friday. It has always been so.",
    "Somebody named a custom object Object__c. Sit with that.",
    "The bug is not in your code. The bug is in a workflow rule you did not know existed.",
    "You will be told the data is clean. Ask one more question."
  ];
  var LUCKY=[
    "100 SOQL · 150 DML · 6MB heap",
    "50,000 rows · 10s CPU · 12 callouts",
    "10 SOQL left · 3 DML left · caffeine low",
    "1 hour estimated · 3 hours actual",
    "2 admins · 1 object · 0 conversations",
    "42 fields · 6 in use",
    "500 batch size · 200 per transaction · 1 hope"
  ];
  var cookie=document.getElementById('cookie'), slip=document.getElementById('slip'),
      quote=document.getElementById('quote'), lucky=document.getElementById('lucky'),
      tap=document.getElementById('tap'), again=document.getElementById('again');
  var lastIdx=-1;

  function pick(){
    var i; do{ i=Math.floor(Math.random()*FORTUNES.length); }while(i===lastIdx && FORTUNES.length>1);
    lastIdx=i; return FORTUNES[i];
  }
  function crack(){
    if(cookie.classList.contains('open')) return reset(true);
    quote.textContent=pick();
    lucky.textContent=LUCKY[Math.floor(Math.random()*LUCKY.length)];
    cookie.classList.add('open'); tap.classList.add('hide');
    setTimeout(function(){ slip.classList.add('show'); },230);
  }
  function reset(thenCrack){
    slip.classList.remove('show'); cookie.classList.remove('open');
    if(thenCrack) setTimeout(crack,420); else tap.classList.remove('hide');
  }
  cookie.addEventListener('click',crack);
  again.addEventListener('click',function(){ reset(true); });
})();
</script>
