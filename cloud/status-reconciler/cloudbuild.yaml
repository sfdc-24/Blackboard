# Build the R-STATUS reconciler with the REPO ROOT as context.
#
# WHY THIS FILE EXISTS AT ALL
#   `gcloud run jobs deploy --source` expects a Dockerfile at the root of the
#   source it uploads. Ours is deliberately not at the repo root - and the build
#   context cannot be cloud/status-reconciler/ either, because the image must copy
#   scripts/bus.py, scripts/board_say.py, scripts/open_for_me.py, scripts/ask_phases.py,
#   scripts/rstatus_reconcile.py and scripts/status_client.py. Keeping ONE copy of each
#   matters more than avoiding this file - a second copy is how a reader and a writer
#   come to disagree about what the board says.
#
#   So: context is `.`, the Dockerfile is named with -f, and /.gcloudignore is an
#   allowlist that sends exactly the files this job needs. Verify with
#   `gcloud meta list-files-for-upload` before the first submit - the repo is 332 MB
#   and holds a .env with live credentials.
#
# Deploy nothing from this branch. This file builds the image only; the Cloud Run job
# itself is created and scheduled by a separate, explicit deploy step after review.

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/sfdc24/cloud-run-source-deploy/status-reconciler:v1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - -f
      - cloud/status-reconciler/Dockerfile
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
