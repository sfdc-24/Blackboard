# Repo root as context; see the Dockerfile.
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/sfdc24/cloud-run-source-deploy/board-watcher:v1

steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}', -f, cloud/board-watcher/Dockerfile, .]

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY
