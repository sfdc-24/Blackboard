# Repo root as context, so the Dockerfile can copy scripts/redis_dual.py and
# cloud/inbox-wake/main.py. The default tag is not a release. Nothing here deploys.
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/sfdc24/cloud-run-source-deploy/fleet-dispatch:unreleased

steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}', -f, cloud/fleet-dispatch/Dockerfile, .]

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY
