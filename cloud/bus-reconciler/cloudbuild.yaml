# Build the bus reconciler with the REPO ROOT as context.
#
# Same shape and the same reason as cloud/board-probe/cloudbuild.yaml: the image
# must copy scripts/bus.py, so the context cannot be this directory, and the
# Dockerfile is therefore named with -f. /.gcloudignore keeps the upload to the
# four files the image needs.

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/sfdc24/cloud-run-source-deploy/bus-reconciler:v1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - -f
      - cloud/bus-reconciler/Dockerfile
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
