# Repo root as context; see the Dockerfile for why board_say.py must not be copied.
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/sfdc24/cloud-run-source-deploy/ack-once:v1

steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}', -f, cloud/ack-once/Dockerfile, .]

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY
